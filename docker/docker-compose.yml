services:
  db:
    image: postgres:16-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s # roda o comando "test" a cada 5 segundos
      timeout: 5s # o tempo máximo que uma única execução do comando test pode levar antes de ser considerada falha por timeout
      retries: 5 # quantas falhas consecutivas (cada uma separada pelo interval de 5s) são necessárias para o Docker marcar o container como unhealthy
    restart: always
    shm_size: 128mb # Garante que queries pesadas não travem o Postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data # ao dar um docker-compose down, os dados não são perdidos ao destruir o container

  api:
    build:
      context: # colocar aqui o dockerfile
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379" # Porta padrão do Redis exposta
    volumes:
      - redis_data:/data # Garante que o cache ou filas persistam se o container reiniciar

volumes:
  postgres_data: # Inicializa o volume do banco
  redis_data: # Inicializa o volume do Redis

